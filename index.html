<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>unruggable-go</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Load the Go WASM runtime -->
    <script src="wasm_exec.js"></script>
    <script>
      // Polyfill for WebAssembly.instantiateStreaming for browsers that don’t support it.
      if (!WebAssembly.instantiateStreaming) {
        WebAssembly.instantiateStreaming = async (resp, importObject) => {
          const source = await (await resp).arrayBuffer();
          return await WebAssembly.instantiate(source, importObject);
        };
      }

      async function runWasm() {
        const go = new Go();
        try {
          const result = await WebAssembly.instantiateStreaming(fetch("unruggable-go.wasm"), go.importObject);
          go.run(result.instance);
        } catch (err) {
          console.error("Failed to load WASM module:", err);
        }
      }

      window.addEventListener("load", runWasm);
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #fff;
      }
    </style>
  </head>
  <body>
    <!-- Optionally, you can include a container if you plan to dynamically mount elements -->
    <div id="app"></div>
  </body>
</html>
